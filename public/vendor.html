<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#173c6b">
<title>Vendor Portal · Coach-Connect</title>
<link rel="stylesheet" href="/styles.css">
<style>
:root{--v-ink:#142b46;--v-muted:#5b6c80;--v-line:#dce5ef;--v-bg:#f3f6fb;--v-blue:#173c6b;--v-green:#176a4b}
body{margin:0;background:var(--v-bg);color:var(--v-ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.v-top{background:#fff;border-bottom:1px solid var(--v-line);padding:16px clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.v-brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:18px;color:var(--v-blue)}.v-logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--v-blue);color:white;font-size:24px}
.v-top small{display:block;color:var(--v-muted);font-size:12px;letter-spacing:.09em;margin-top:3px}
.v-nav{display:flex;gap:8px;flex-wrap:wrap}.v-nav a{padding:10px 13px;border:1px solid var(--v-line);border-radius:10px;text-decoration:none;color:var(--v-blue);font-weight:700;background:white}.v-nav a:hover{background:#eef4fb}
.v-wrap{max-width:1180px;margin:0 auto;padding:28px clamp(14px,3vw,32px) 60px}
.v-hero{background:linear-gradient(120deg,#173c6b,#226b67);color:white;border-radius:22px;padding:clamp(22px,4vw,38px);margin-bottom:22px}.v-hero .eyebrow{font-size:12px;letter-spacing:.14em;font-weight:800;opacity:.8}.v-hero h1{font-size:clamp(28px,4vw,42px);line-height:1.12;margin:10px 0}.v-hero p{max-width:760px;line-height:1.65;margin:0;color:#e7f1f7}
.v-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}.v-panel{background:white;border:1px solid var(--v-line);border-radius:18px;padding:clamp(18px,3vw,28px);box-shadow:0 6px 20px #18395b08}.v-panel h2{margin:0 0 7px;font-size:23px;color:var(--v-blue)}.v-muted{color:var(--v-muted);line-height:1.55}.v-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.v-field label,.v-menu-form label{display:block;font-weight:750;font-size:14px;margin-bottom:7px}.v-field input,.v-field select,.v-field textarea,.v-menu-form input,.v-menu-form select{box-sizing:border-box;width:100%;min-height:46px;border:1px solid #bfccda;border-radius:9px;padding:10px 12px;background:white;color:var(--v-ink);font:inherit;font-size:15px}.v-field textarea{min-height:76px;resize:vertical}.v-field.full{grid-column:1/-1}.v-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.v-btn{border:0;border-radius:10px;padding:12px 16px;min-height:44px;background:var(--v-green);color:white;font:inherit;font-weight:800;cursor:pointer}.v-btn.alt{background:#eef3f8;color:var(--v-blue);border:1px solid #d4dfeb}.v-btn.danger{background:#fff0f0;color:#a32323;border:1px solid #f0caca}.v-btn:disabled{opacity:.55;cursor:wait}
.v-stall{border:1px solid var(--v-line);border-radius:15px;padding:18px;margin-top:14px;background:#fff}.v-stall-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.v-stall h3{margin:5px 0;color:var(--v-blue);font-size:20px}.v-pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#edf3f9;color:var(--v-blue);font-size:12px;font-weight:800}.v-stall-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.v-fact{background:#f6f8fb;padding:11px;border-radius:10px;overflow-wrap:anywhere}.v-fact small{display:block;color:var(--v-muted);margin-bottom:5px}.v-menu-item{border-top:1px solid #e8edf3;padding:14px 0}.v-menu-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.v-menu-form{display:grid;gap:10px}.v-message{min-height:22px;color:#a32323;font-weight:650;margin:10px 0}.v-empty{border:1px dashed #bdcbd9;border-radius:14px;padding:24px;text-align:center;color:var(--v-muted)}
@media(max-width:650px){.v-form-grid,.v-stall-facts,.v-menu-grid{grid-template-columns:1fr}.v-top{align-items:flex-start}.v-nav{width:100%}.v-nav a{flex:1;text-align:center}}
</style>
</head>
<body>
<header class="v-top"><div class="v-brand"><span class="v-logo">↗</span><div>Coach-Connect <small>INDEPENDENT VENDOR PORTAL</small></div></div><nav class="v-nav" aria-label="Vendor navigation"><a href="#dashboard">Dashboard</a><a href="#my-stalls">My Stalls</a><a href="#menu-management">Menu & Stock</a><a href="#location-management">Station & Location</a><a href="/">Passenger Website ↗</a></nav></header>
<main id="vendor-app" class="v-wrap"><section class="v-panel">Loading your vendor workspace…</section></main>
<script src="/vendor.js" defer></script>
</body></html>
